name: Build RESQ-MITRA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "lib/**"
      - "assets/**"
      - "pubspec.yaml"
      - "android/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.resqmitra --project-name resq_mitra --overwrite .

      - name: Add Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
          ]
          marker = '<application'
          if marker not in s:
              raise SystemExit('AndroidManifest.xml does not contain <application')
          for permission in permissions:
              if permission not in s:
                  s = s.replace(marker, permission + '\n    ' + marker, 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RESQ-MITRA-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
